[project]
name = "flintmc"
version = "0.2.0"
description = "Multi-architecture assembler backed by llvm-mc"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
compat = [
    "keystone-engine>=0.9.2",
    # "nyxstone>=0.1.0",  # needs LLVM 15-18; build broken on macOS (missing -std=c++17)
                        # export NYXSTONE_LLVM_PREFIX=/opt/homebrew/opt/llvm@18
                        # export CXXFLAGS="-std=c++17"
]

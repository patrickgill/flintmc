[project]
name = "flintmc"
version = "0.2.0"
description = "LLVM-backed multi-architecture assembler for Python"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]
compat = [
    # "keystone-engine>=0.9.2",
    # "nyxstone>=0.1.0",  # needs LLVM 15-18 and manual build flags:
                        # NYXSTONE_LLVM_PREFIX=/opt/homebrew/opt/llvm@18 \
                        # CXXFLAGS="-std=c++17" \
                        # LDFLAGS="-L/opt/homebrew/Cellar/zstd/1.5.7_1/lib" \
                        # uv pip install nyxstone
]
